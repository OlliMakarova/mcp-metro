# Shared TLS hardening for the wildcard-certificate flavour, pulled in with
# `include snippets/ssl-params.conf;`. Deploy as /etc/nginx/snippets/ssl-params.conf.
#
# NOTE: if you obtain the certificate with certbot instead of a wildcard, prefer certbot's own
# `include /etc/letsencrypt/options-ssl-nginx.conf;` + `ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;`
# (both created by certbot) and do NOT include this file — that avoids maintaining SSL params by hand.
#
# Security headers (X-Frame-Options, X-Content-Type-Options, Referrer-Policy, …) are intentionally NOT
# set here: fa-mcp-sdk already emits them on every response, and adding them at the proxy produces
# duplicate / conflicting headers.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
ssl_ecdh_curve secp384r1; # Requires nginx >= 1.1.0
ssl_session_timeout  10m;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off; # Requires nginx >= 1.5.9

# OCSP stapling is off by default (Let's Encrypt certificates carry no OCSP responder URL, which only
# produces "ssl_stapling ignored" warnings). Enable it only for a CA that supports it.
ssl_stapling off;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# HSTS is left commented — enable only once you understand you are committing the domain to HTTPS.
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
