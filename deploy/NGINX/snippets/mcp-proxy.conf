# Common reverse-proxy settings shared by every location of an fa-mcp-sdk server.
# Deploy as /etc/nginx/snippets/mcp-proxy.conf and pull it in with `include snippets/mcp-proxy.conf;`.
#
# `proxy_http_version 1.1` + an empty `Connection` header are what keep the upstream connection
# alive and allow chunked / streamed (Server-Sent Events) responses to pass through at all.
#
# The X-Forwarded-* headers are how the Node process learns that it is served over HTTPS on a public
# domain. Set `webServer.trustProxy: true` in config/*.yaml so Express actually honours them —
# otherwise `req.protocol` stays "http", `req.ip` is always 127.0.0.1, and that breaks:
#   * the OAuth / OIDC discovery documents (/.well-known/*), which would advertise http:// URLs;
#   * the optional JWT IP restriction (`webServer.auth.jwtToken.isCheckIP`);
#   * per-IP rate limiting (`mcp.rateLimit.scope: 'ip'`) and every log line that prints the client IP.

proxy_http_version 1.1;
proxy_set_header Connection '';

proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;

proxy_connect_timeout 5s;
proxy_redirect off;
