# sudo vim /etc/nginx/sites-enabled/{{mcp.domain}}.conf
#
# Reverse proxy for an MCP server built with fa-mcp-sdk.
#
# Copy `snippets/mcp-proxy.conf` (shipped next to this file) to /etc/nginx/snippets/ — every
# location below includes it to get the shared proxy headers and keepalive settings.
#
# Why the endpoints are split into separate `location` blocks instead of one catch-all `/`:
#
#   * /mcp, /sse and /messages carry the MCP protocol itself. The MCP SDK answers a JSON-RPC request
#     with a Server-Sent Events stream (`Content-Type: text/event-stream`) unless the client insists
#     on plain JSON, and it pushes progress notifications and log messages into that stream while the
#     tool is still running. NGINX buffers proxied responses by default, so without
#     `proxy_buffering off` the frames pile up inside NGINX and the client sees nothing until the
#     whole response is complete — which for a long tool call looks exactly like a hung server.
#   * Those same streams are idle most of the time: `GET /mcp` and `GET /sse` stay open waiting for
#     server-initiated messages, and fa-mcp-sdk sends no heartbeat / ping frames of its own. NGINX
#     drops a connection that produced nothing for `proxy_read_timeout` (60 seconds by default), and
#     the client reports that as a lost MCP session. Hence the deliberately long timeouts below.
#   * Everything else (home page, /docs, /api, /health, /admin) is an ordinary request/response pair
#     and works fine with the NGINX defaults.
#
# The MCP transports use plain HTTP/1.1 and SSE — there is no WebSocket anywhere in fa-mcp-sdk, so no
# `Upgrade` / `Connection: upgrade` mapping is needed.

# Backend Node.js process.
upstream {{upstream}} {
    server 127.0.0.1:{{port}};
    keepalive 8;
}

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# Running MORE THAN ONE instance behind this upstream requires session affinity. A Streamable HTTP
# session is stateful and lives in the memory of a single process: the transport is created by the
# `initialize` call and addressed afterwards by the `Mcp-Session-Id` request header. A request routed
# to another instance is rejected with JSON-RPC -32600 ("no valid session"). The map below keeps every
# request of one session on one instance and spreads the initial (header-less) calls by client IP:
#
# map $http_mcp_session_id $mcp_sticky_key {
#     ''      $remote_addr;
#     default $http_mcp_session_id;
# }
# upstream {{upstream}} {
#     hash $mcp_sticky_key consistent;
#     server 127.0.0.1:{{port}};
#     server 127.0.0.1:<second-port>;
#     keepalive 16;
# }
# ─────────────────────────────────────────────────────────────────────────────────────────────────

server {
    server_name {{mcp.domain}};
    access_log /var/log/nginx/{{mcp.domain}}.log;
    error_log /var/log/nginx/{{mcp.domain}}.ERROR.log;

    # Keep this slightly ABOVE `mcp.limits.maxPayloadBytes` (1 MiB by default) so an oversized body is
    # rejected by the application — which answers with a proper JSON-RPC -32005 / HTTP 413 — instead of
    # being cut off by NGINX with an HTML error page the MCP client cannot parse.
    client_max_body_size 2m;

    # Custom HTTP headers declared by the project (`usedHttpHeaders`) reach the tool handlers only if
    # their names contain no underscores. Uncomment if you really need headers like `x_api_key`.
    # underscores_in_headers on;

    # Compression for documentation, OpenAPI and REST payloads. Streaming locations switch it off
    # explicitly — a compressor sitting in front of an SSE stream delays the frames.
    gzip on;
    gzip_types text/plain text/css text/markdown application/json application/javascript;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    # ── MCP protocol: Streamable HTTP (POST/GET/DELETE /mcp) ─────────────────────────────────────
    # POST carries the JSON-RPC calls, GET is the server-initiated event stream of the active session,
    # DELETE tears the session down. `proxy_read_timeout` must outlive the longest tool call
    # (`mcp.limits.toolTimeoutMs`, 30 s by default) AND the idle time of the GET stream, so an hour is
    # a sane starting value. Raise it if you enable long-running tasks (`mcp.tasks.enabled`).
    location /mcp {
        include snippets/mcp-proxy.conf;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass http://{{upstream}};
    }

    # ── MCP protocol: legacy SSE transport (GET/POST /sse, POST /messages) ───────────────────────
    # Kept for clients that do not speak Streamable HTTP yet. `GET /sse` opens the event stream,
    # `POST /messages?sessionId=…` (or `POST /sse`) delivers the client's JSON-RPC messages into it.
    location ~ ^/(sse|messages)$ {
        include snippets/mcp-proxy.conf;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass http://{{upstream}};
    }

    # ── Agent Tester (built-in chat UI, `agentTester.enabled`) ───────────────────────────────────
    # Two reasons for its own block: `POST /agent-tester/api/mcp/call-tool-stream` is an SSE stream of
    # live tool progress, and a chat turn waits for an LLM plus one or more tool calls, which routinely
    # takes minutes. Ten minutes covers both; the endpoint is a development tool, so restricting it to
    # your office / VPN networks is a good idea.
    location /agent-tester {
        include snippets/mcp-proxy.conf;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # allow 10.0.0.0/8;
        # allow 192.168.0.0/16;
        # deny all;

        proxy_pass http://{{upstream}};
    }

    # ── Prometheus metrics (`webServer.metrics.enabled`) ─────────────────────────────────────────
    # The application serves /metrics without any authentication by design and expects the reverse
    # proxy to shield it. Widen the allow-list to the address of your Prometheus scraper.
    location /metrics {
        include snippets/mcp-proxy.conf;

        allow 127.0.0.1;
        # allow 10.0.0.0/8;
        deny all;

        proxy_pass http://{{upstream}};
    }

    # ── Liveness / readiness probes ──────────────────────────────────────────────────────────────
    # Polled every few seconds by the monitoring system; logging every hit only inflates the log file.
    location ~ ^/(health|ready)$ {
        include snippets/mcp-proxy.conf;

        access_log off;
        proxy_read_timeout 10s;

        proxy_pass http://{{upstream}};
    }

    # ── Token issuing surface: Admin UI (/admin) and the JWT API (/gen-jwt) ──────────────────────
    # Both hand out access credentials for this server. If the tokens are only ever issued from inside
    # the corporate network, uncomment the allow-list — it is the cheapest possible protection layer.
    location ~ ^/(admin|gen-jwt)(/|$) {
        include snippets/mcp-proxy.conf;

        # allow 10.0.0.0/8;
        # allow 192.168.0.0/16;
        # deny all;

        proxy_pass http://{{upstream}};
    }

    # ── Example: a project-specific REST endpoint that streams or runs long ──────────────────────
    # Endpoints added by the project under /api are proxied by the catch-all block below with NGINX's
    # default 60-second read timeout and response buffering ON. If one of them streams its answer or
    # legitimately runs longer than a minute, give it a block of its own, like this:
    #
    # location = /api/<your-long-running-endpoint> {
    #     include snippets/mcp-proxy.conf;
    #     proxy_buffering off;
    #     proxy_cache off;
    #     gzip off;
    #     proxy_read_timeout 600s;
    #     proxy_send_timeout 600s;
    #     proxy_pass http://{{upstream}};
    # }

    # ── Everything else ──────────────────────────────────────────────────────────────────────────
    # Home page (/), Swagger UI (/docs), OpenAPI documents, REST API (/api), token check (/ct),
    # static assets (/static, /svg) and the OAuth discovery documents (/.well-known/*, /oauth/token).
    location / {
        include snippets/mcp-proxy.conf;

        proxy_pass http://{{upstream}};
    }

    # On NGINX 1.25.1 and newer the combined form is deprecated — use `listen 443 ssl;` plus a separate
    # `http2 on;` directive instead.
    listen 443 ssl http2;
    include {{ssl-wildcard.conf.rel.path}};
    include snippets/ssl-params.conf;
    ssl_protocols  TLSv1.3;
}

server {
    if ($host = {{mcp.domain}}) {
        return 301 https://$host$request_uri;
    }

    listen 0.0.0.0:80;
    server_name {{mcp.domain}};
    return 404;
}

# sudo nginx -t && sudo systemctl reload nginx
