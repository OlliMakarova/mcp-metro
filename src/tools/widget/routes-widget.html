<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metro routes</title>
  <style>
    /* Host style variables with fallbacks (MCP Apps standardized custom properties).
       When the host provides --color-* variables they win; otherwise the fallback chain
       below keeps the widget readable, including a dark-theme set of fallbacks. */
    :root {
      --w-bg: var(--color-background-secondary, #f2f3f5);
      --w-card: var(--color-background-primary, #ffffff);
      --w-card2: var(--color-background-tertiary, #f7f7f9);
      --w-text: var(--color-text-primary, #18181c);
      --w-text2: var(--color-text-secondary, #75757d);
      --w-border: var(--color-border-primary, #e4e4e9);
      --w-danger-bg: var(--color-background-danger, #fdeaea);
      --w-danger-tx: var(--color-text-danger, #b42318);
      --w-warn-bg: var(--color-background-warning, #fff4e0);
      --w-warn-tx: var(--color-text-warning, #8a5a00);
      --w-accent: #d6dbe8;
      --w-radius: var(--border-radius-lg, 14px);
      --w-radius-sm: var(--border-radius-md, 10px);
      --w-font: var(--font-sans, -apple-system, "Segoe UI", system-ui, "Noto Sans", sans-serif);
    }
    html[data-theme="dark"] {
      --w-bg: var(--color-background-secondary, #202024);
      --w-card: var(--color-background-primary, #2b2b31);
      --w-card2: var(--color-background-tertiary, #34343b);
      --w-text: var(--color-text-primary, #ececf1);
      --w-text2: var(--color-text-secondary, #9c9ca6);
      --w-border: var(--color-border-primary, #3d3d45);
      --w-danger-bg: var(--color-background-danger, #45211f);
      --w-danger-tx: var(--color-text-danger, #ff9e94);
      --w-warn-bg: var(--color-background-warning, #453518);
      --w-warn-tx: var(--color-text-warning, #ffce7a);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: var(--w-font);
      color: var(--w-text);
      font-size: 14px;
      line-height: 1.45;
    }
    .panel {
      background: var(--w-bg);
      border-radius: var(--w-radius);
      padding: 14px;
      max-width: 560px;
    }
    .hidden { display: none !important; }

    /* ── Header: «from» / «to» station selects ───────────────────────────── */
    .od { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .od-sel { position: relative; }
    .od-field {
      display: flex; align-items: center; gap: 8px;
      background: var(--w-accent);
      color: #3d4657;
      border: 1px solid transparent;
      border-radius: var(--w-radius-sm);
      padding: 8px 12px;
      font-weight: 600;
      cursor: text;
    }
    .od-field:focus-within { border-color: #6d7fa8; }
    .od-field input {
      flex: 1 1 auto; min-width: 0;
      margin: 0; padding: 0;
      border: 0; background: transparent;
      font: inherit; color: inherit;
      outline: none;
      text-overflow: ellipsis;
    }
    .od-field input::placeholder { color: currentColor; opacity: .55; font-weight: 500; }
    .od-badges { display: flex; align-items: center; gap: 4px; flex: none; }
    .od-caret { flex: none; opacity: .55; font-size: 12px; line-height: 1; }
    .od-list {
      position: absolute; z-index: 5;
      inset-inline-start: 0; inset-inline-end: 0; top: calc(100% + 4px);
      max-height: 240px; overflow-y: auto;
      padding: 4px;
      background: var(--w-card);
      border: 1px solid var(--w-border);
      border-radius: var(--w-radius-sm);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .16);
    }
    .od-opt {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--w-text);
    }
    .od-opt.active { background: var(--w-card2); }
    .od-opt .od-nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .od-note { padding: 8px; color: var(--w-text2); font-size: 13px; }
    html[data-theme="dark"] .od-field { background: #3a4152; color: #dfe4ee; }

    /* ── Line badge ──────────────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; padding: 0 4px;
      border-radius: 999px;
      background: var(--bc, #999);
      color: #fff;
      font-size: 11px; font-weight: 700;
      flex: none;
    }
    .badge.dot { min-width: 12px; height: 12px; padding: 0; }

    /* ── Banners ─────────────────────────────────────────────────────────── */
    .banner { border-radius: var(--w-radius-sm); padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
    .banner.danger { background: var(--w-danger-bg); color: var(--w-danger-tx); }
    .banner.warn { background: var(--w-warn-bg); color: var(--w-warn-tx); }
    .banner.info { background: var(--w-card); color: var(--w-text2); }

    /* ── Section titles ──────────────────────────────────────────────────── */
    .sect { font-size: 17px; font-weight: 700; margin: 14px 2px 8px; }
    .sect:first-child { margin-top: 0; }

    /* ── Variant summary cards ───────────────────────────────────────────── */
    .variants { display: flex; flex-direction: column; gap: 8px; }
    .vcard {
      background: var(--w-card);
      border: 2px solid transparent;
      border-radius: var(--w-radius-sm);
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .vcard:hover { border-color: var(--w-border); }
    .vcard.active { border-color: #6d7fa8; }
    .vrow { display: flex; align-items: baseline; gap: 8px; }
    .vtime { font-size: 16px; font-weight: 700; }
    .varr { color: var(--w-text2); font-size: 13px; }
    .vtransfers { margin-inline-start: auto; color: var(--w-text2); font-size: 13px; }
    .vlines { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
    .vlines .sep { width: 4px; height: 4px; border-radius: 999px; background: var(--w-text2); opacity: .55; }

    /* ── Details timeline ────────────────────────────────────────────────── */
    .tl { background: var(--w-card); border-radius: var(--w-radius-sm); padding: 12px 12px 12px 8px; }
    .trow { display: grid; grid-template-columns: 44px 22px 1fr; column-gap: 6px; }
    .tt { color: var(--w-text2); font-size: 12px; text-align: end; padding-top: 2px; font-variant-numeric: tabular-nums; }
    .rail { position: relative; display: flex; justify-content: center; }
    .rail .bar { position: absolute; top: 0; bottom: 0; width: 4px; border-radius: 2px; background: var(--rc, var(--w-border)); }
    .rail .bar.walkbar {
      width: 0; border-inline-start: 2px dotted var(--w-text2);
      background: none; border-radius: 0; opacity: .6;
    }
    .rail .node {
      position: relative; z-index: 1;
      width: 12px; height: 12px; margin-top: 3px;
      border-radius: 999px;
      background: var(--w-card);
      border: 3px solid var(--rc, var(--w-text2));
    }
    .rail .walker { position: relative; z-index: 1; font-size: 13px; line-height: 1; margin-top: 3px; }
    .tc { padding: 0 0 14px 2px; min-width: 0; }
    .trow:last-child .tc { padding-bottom: 2px; }
    .tname { font-weight: 700; }
    .tline { color: var(--w-text2); font-size: 12.5px; margin-top: 1px; }
    .tdur { float: inline-end; color: var(--w-text2); font-size: 12.5px; margin-inline-start: 8px; }
    .twalk { color: var(--w-text); }
    .twalk .note { color: var(--w-text2); font-size: 12.5px; margin-top: 1px; }

    /* Wagon recommendation box */
    .wagons {
      background: var(--w-card2);
      border-radius: var(--w-radius-sm);
      padding: 10px 12px;
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--w-text2);
    }
    .train { display: flex; align-items: flex-end; gap: 3px; margin-bottom: 6px; }
    .car {
      width: 30px; height: 12px;
      border-radius: 3px;
      background: color-mix(in srgb, var(--w-text2) 28%, transparent);
      position: relative;
    }
    .car.hl { background: var(--w-text); }
    .car.hl::after {
      content: ""; position: absolute; left: 50%; bottom: -7px;
      transform: translateX(-50%);
      border-left: 4px solid transparent; border-right: 4px solid transparent;
      border-bottom: 5px solid var(--w-text);
    }
    .train.pad { margin-bottom: 10px; }

    /* Collapsible intermediate stations */
    details.stops { margin-top: 6px; }
    details.stops summary {
      display: inline-flex; align-items: center; gap: 6px;
      list-style: none; cursor: pointer;
      background: var(--w-card2);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12.5px; color: var(--w-text2);
      user-select: none;
    }
    details.stops summary::-webkit-details-marker { display: none; }
    details.stops summary::after { content: "⌄"; font-size: 12px; transition: transform .15s; }
    details.stops[open] summary::after { transform: rotate(180deg); }
    details.stops ul { margin: 6px 0 0; padding: 0 0 0 2px; list-style: none; }
    details.stops li { color: var(--w-text2); font-size: 12.5px; padding: 2px 0 2px 14px; position: relative; }
    details.stops li::before {
      content: ""; position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
      width: 6px; height: 6px; border-radius: 999px;
      background: var(--rc, var(--w-text2));
    }

    /* Breakdown line under the timeline */
    .breakdown { color: var(--w-text2); font-size: 12.5px; margin: 8px 2px 0; }

    /* Ground transport + warnings */
    .gt { background: var(--w-card); border-radius: var(--w-radius-sm); padding: 10px 12px; margin-top: 8px; font-size: 13px; }
    .gt .gt-title { font-weight: 700; margin-bottom: 4px; }
    .gt .gt-row { color: var(--w-text2); }
    .warns { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .warn-item { border-radius: var(--w-radius-sm); padding: 9px 12px; font-size: 13px; }
    .warn-item.CLOSED { background: var(--w-danger-bg); color: var(--w-danger-tx); }
    .warn-item.EMERGENCY { background: var(--w-warn-bg); color: var(--w-warn-tx); }
    .warn-item.INFO { background: var(--w-card); color: var(--w-text2); }
    .warn-item b { display: block; }

    /* ── Markdown fallback (station info / clarifications) ───────────────── */
    .md { background: var(--w-bg); border-radius: var(--w-radius); padding: 14px 16px; max-width: 640px; }
    .md h1 { font-size: 18px; margin: 0 0 10px; }
    .md h2 { font-size: 15px; margin: 14px 0 6px; }
    .md h3 { font-size: 14px; margin: 12px 0 6px; }
    .md p, .md ul, .md ol { margin: 6px 0; }
    .md ul, .md ol { padding-inline-start: 20px; }
    .md li { margin: 2px 0; }
    .md em { color: var(--w-text2); }
    .md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; max-width: 100%; }
    .md th, .md td { border: 1px solid var(--w-border); padding: 4px 8px; text-align: start; }
    .md th { background: var(--w-card2); }
    .md.error { background: var(--w-danger-bg); color: var(--w-danger-tx); }

    .loading { color: var(--w-text2); font-size: 13px; padding: 10px 2px; }

    /* ── Refresh-route button ────────────────────────────────────────────── */
    .refresh {
      display: inline-flex; align-items: center; gap: 6px;
      margin: 0 0 10px;
      padding: 7px 12px;
      border: 1px solid var(--w-border);
      border-radius: var(--w-radius-sm);
      background: var(--w-card);
      color: var(--w-text);
      font: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    .refresh:hover { border-color: #6d7fa8; }
    .refresh:disabled { opacity: .6; cursor: default; }
  </style>
</head>

    // ─── MCP Apps view: postMessage JSON-RPC with the host (SEP-1865) ────────
    // Lifecycle: ui/initialize → ui/notifications/initialized → wait for
    // ui/notifications/tool-result → render. The widget also answers
    // ui/resource-teardown and ping requests and reports its size to the host.
    const host = window.parent;
    let nextId = 1;
    const pending = new Map();

    function rpcRequest(method, params) {
      const id = nextId++;
      const p = new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
      host.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
      return p;
    }
    function rpcNotify(method, params) {
      host.postMessage({ jsonrpc: '2.0', method, params }, '*');
    }
    function rpcRespond(id, result) {
      host.postMessage({ jsonrpc: '2.0', id, result }, '*');
    }

    // ─── i18n ────────────────────────────────────────────────────────────────
    const ruPlural = (n, forms) => {
      const a = Math.abs(n) % 100;
      const b = a % 10;
      if (a > 10 && a < 20) return forms[2];
      if (b > 1 && b < 5) return forms[1];
      if (b === 1) return forms[0];

        loadingRoutes: '正在加载路线…', refresh: '刷新路线',
        loadError: '无法加载路线数据 — 请重新提问。',
        netError: '无法获取路线数据：数据服务器不可达。',
        fromLabel: '出发', toLabel: '到达', stationPlaceholder: '车站…',
        stationsLoading: '正在加载车站列表…',
        stationsLoadError: '无法加载车站列表。',
        noMatches: '未找到匹配项',
        sameStations: '出发站与到达站相同。',
        recalculating: '正在重新规划路线…',
        recalcError: '无法重新规划路线。',
      },
    };
    let L = DICT.en;

    // ─── Helpers ─────────────────────────────────────────────────────────────
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));

    const fmtDur = (sec) => {
      const min = Math.max(1, Math.round(sec / 60));
      if (min < 60) return `${min} ${L.min}`;
      const h = Math.floor(min / 60);
      const m = min % 60;
      return m ? `${h} ${L.hour} ${String(m).padStart(2, '0')} ${L.min}` : `${h} ${L.hour}`;
    };

    /** «HH:MM» plus seconds → «HH:MM» wrapped over midnight; null when base is unknown */
    const addToClock = (hhmm, sec) => {
      const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || '');
      if (!m) return null;
      const total = ((+m[1] * 60 + +m[2]) + Math.round(sec / 60)) % (24 * 60);
      const t = (total + 24 * 60) % (24 * 60);
      return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
    };

    const badgeHtml = (line) => {
      if (!line) return '';
      const color = esc(line.color || '#999');
      if (line.badge) {
        return `<span class="badge" style="--bc:${color}">${esc(line.badge)}</span>`;
      }
      return `<span class="badge dot" style="--bc:${color}"></span>`;
    };

    // Google Material Icons «directions_walk» (filled, 24×24), Apache License 2.0 —
    // inlined because the sandbox CSP forbids loading external icon fonts/files
    const WALK_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>`;

    // ─── Routes rendering ────────────────────────────────────────────────────
    let data = null;
    let selected = 0;
    // The self-describing signed link the widget loads its route data from. The "Refresh route"
    // button reuses it with the `at` parameter removed, so the route is rebuilt for "now". It is
    // never overwritten by a recompute: it stays the card's anchor for renewing an expired token.
    let currentDataUrl = null;
    // Host capabilities from the ui/initialize response (used to gate ui/update-model-context).
    let hostCapabilities = {};

    // ─── Station-select state ────────────────────────────────────────────────
    // The card's two dropdowns let the user swap either end of the route. Picking a station sends a
    // token-authorized recompute to the server and re-renders the card in place — no new question
    // to the bot. All of it hangs on the state below.

    /** Minimum interval (ms) between two recompute requests — mirrors the server-side floor */
    const RECOMPUTE_MS = 2000;
    const ENDS = ['from', 'to'];

    /** Current choice per end: { name, ids, lines } — `ids` are the platform ids sent to the server */
    const sel = { from: null, to: null };
    /** Whole-city station list, fetched lazily on the first dropdown open and kept for the card's life */
    let stationList = null;
    let stationsPending = null;
    let stationsFailed = false;
    /** «lang|city» the cached list was built for — a card reused for another one refetches it */
    let stationsKey = null;
    /** Recompute token from the last successful data response (its expiry slides forward on every one) */
    let recomputeToken = null;
    /** One silent token renewal per expiry — a second 403 in a row is a real error */
    let tokenRenewed = false;
    /** Open dropdown: which end, the typed filter, the highlighted option and the options shown */
    let openEnd = null;
    let optQuery = '';
    let optIndex = -1;
    let optItems = [];
    /** True once the user picked a different station — from then on "Refresh" recomputes the new pair */
    let stationsChanged = false;
    /** Walk times of the original link; the one describing a replaced end is dropped */
    let walkParams = { walk: null, walkFrom: null };
    /** Message shown above the live card: recompute progress, a hint or an error */
    let notice = null;
    let noticeKind = 'info';
    /** Trailing-throttle bookkeeping: when the last request went out and the pending timer */
    let lastRecomputeAt = 0;
    let recomputeTimer = null;

    /** Applies a response language before data arrives (loading / error states) */
    function applyLang(lang) {
      L = DICT[lang] || DICT.en;
      document.documentElement.lang = lang === 'cn' ? 'zh' : (lang || 'en');
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    }

    /** Reads the response language straight from the data link (before the fetch resolves) */
    function langFromUrl(url) {
      try {
        return new URL(url).searchParams.get('lang') || 'en';
      } catch {
        return 'en';
      }
    }

    function trainHtml(wagons) {
      const hl = { front: 0, middle: 2, rear: 4 };
      const on = new Set((wagons || []).map((w) => hl[w]).filter((v) => v !== undefined));
      let cars = '';
      for (let i = 0; i < 5; i++) cars += `<div class="car${on.has(i) ? ' hl' : ''}"></div>`;
      return `<div class="train pad">${cars}</div>`;
    }

    function wagonText(wagons) {
      const names = { front: L.wagonFront, middle: L.wagonMiddle, rear: L.wagonRear };
      return `${L.forTransfer} ${(wagons || []).map((w) => names[w]).join(', ')}`;
    }

    function lineTitle(line) {
      if (!line) return '';
      let name = line.name || '';
      if (!name && line.kind === 'mcc') name = L.mcc;
      return name;
    }

    /** Summary card of one variant; walkSec / walkFromSec — the user's walks to/from the metro (0 if unknown) */
    function variantCard(v, idx, startClock, walkSec, walkFromSec) {
      const arr = startClock
        ? addToClock(startClock, walkSec + (v.departure.enterTimeSec || 0) + v.totalTimeSec + (v.arrival.exitTimeSec || 0) + walkFromSec)
        : null;
      const badges = v.legs.filter((l) => l.kind === 'ride').map((l) => badgeHtml(l.line))
        .join('<span class="sep"></span>');
      return `<div class="vcard${idx === selected ? ' active' : ''}" data-idx="${idx}" role="button" tabindex="0">
        <div class="vrow">
          <span class="vtime">${fmtDur(v.totalTimeSec + walkSec + walkFromSec)}</span>
          ${arr ? `<span class="varr">~${arr}</span>` : ''}
          <span class="vtransfers">${L.transfers(v.transfersCount)}</span>
        </div>
        <div class="vlines">${badges}</div>
      </div>`;
    }

    const walkRow = (text, durSec, note) => `<div class="trow">
      <div class="tt"></div>
      <div class="rail"><div class="bar walkbar"></div><div class="walker">${WALK_SVG}</div></div>
      <div class="tc twalk">
        ${durSec != null ? `<span class="tdur">~${fmtDur(durSec)}</span>` : ''}
        <div>${esc(text)}</div>
        ${note ? `<div class="note">${esc(note)}</div>` : ''}
      </div>
    </div>`;

    /** Timeline rows of the selected variant; walkSec / walkFromSec — the walks to/from the metro (0 if unknown) */
    function timelineHtml(v, startClock, walkSec, walkFromSec) {
      const rows = [];
      // Average expected wait before each boarding — used only to shift clock marks
      const rideLegs = v.legs.filter((l) => l.kind === 'ride');
      const waitPerBoard = rideLegs.length ? v.waitTimeSec / rideLegs.length : 0;
      let t = walkSec + (v.departure.enterTimeSec || 0); // seconds since "now"

      if (walkSec) {
        rows.push(walkRow(L.walkToMetro, walkSec));
      }
      if (v.departure.enterTimeSec !== undefined) {
        rows.push(walkRow(L.walkToStation, v.departure.enterTimeSec));
      } else {
        rows.push(walkRow(L.walkToStation, null));
      }

      v.legs.forEach((leg, i) => {
        if (leg.kind === 'ride') {
          t += waitPerBoard;
          const color = esc((leg.line && leg.line.color) || '#999');
          const boardClock = startClock ? addToClock(startClock, t) : null;
          const alightClock = startClock ? addToClock(startClock, t + leg.timeSec) : null;
          const next = v.legs[i + 1];
          const wagons = next && next.kind === 'transfer' ? next.wagons : undefined;
          const mid = leg.stations.slice(1, -1);
          rows.push(`<div class="trow" style="--rc:${color}">
            <div class="tt">${boardClock || ''}</div>
            <div class="rail"><div class="bar"></div><div class="node"></div></div>
            <div class="tc">
              <span class="tdur">${fmtDur(leg.timeSec)}</span>
              <div class="tname">${badgeHtml(leg.line)} ${esc(leg.stations[0])}</div>
              <div class="tline">${esc(lineTitle(leg.line))}</div>
              ${wagons ? `<div class="wagons">${trainHtml(wagons)}<div>${esc(wagonText(wagons))}</div></div>` : ''}
              ${mid.length ? `<details class="stops"><summary>${L.stations(mid.length)}</summary>
                <ul>${mid.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></details>` : ''}
            </div>
          </div>
          <div class="trow" style="--rc:${color}">
            <div class="tt">${alightClock || ''}</div>
            <div class="rail">${i === v.legs.length - 1 ? '' : '<div class="bar walkbar"></div>'}<div class="node"></div></div>
            <div class="tc"><div class="tname">${esc(leg.stations[leg.stations.length - 1])}</div></div>
          </div>`);
          t += leg.timeSec;
        } else {
          const notes = [];
          if (leg.isGround) notes.push(L.streetTransfer);
          if (leg.isAlternative) notes.push(L.detour);
          rows.push(walkRow(L.makeTransfer, leg.timeSec, notes.join(' · ') || null));
          t += leg.timeSec;
        }
      });

      if (v.arrival.exitTimeSec !== undefined) {
        rows.push(walkRow(L.exitToCity, v.arrival.exitTimeSec));
      }
      if (walkFromSec) {
        rows.push(walkRow(L.walkFromMetro, walkFromSec));
      }
      return `<div class="tl">${rows.join('')}</div>`;
    }

    function breakdownHtml(v, walkSec, walkFromSec) {
      const parts = [
        walkSec ? `${L.walkToMetroLc} ${fmtDur(walkSec)}` : null,
        `${L.ride} ${fmtDur(v.rideTimeSec)}`,
        v.transfersCount ? `${L.transferTime} ${fmtDur(v.transferTimeSec)}` : null,
        `${L.wait} ~${fmtDur(v.waitTimeSec)}`,
        v.departure.enterTimeSec !== undefined ? `${L.entry} ~${fmtDur(v.departure.enterTimeSec)}` : null,
        v.arrival.exitTimeSec !== undefined ? `${L.exit} ~${fmtDur(v.arrival.exitTimeSec)}` : null,
        walkFromSec ? `${L.walkFromMetroLc} ${fmtDur(walkFromSec)}` : null,
      ].filter(Boolean);
      return `<div class="breakdown">${parts.join(' · ')}</div>`;
    }

    function groundTransportHtml(v) {
      const ep = v.arrival;
      const rows = [
        ep.buses && ep.buses.length ? `${L.buses}: ${ep.buses.join(', ')}` : null,
        ep.trolleybuses && ep.trolleybuses.length ? `${L.trolleybuses}: ${ep.trolleybuses.join(', ')}` : null,
        ep.trams && ep.trams.length ? `${L.trams}: ${ep.trams.join(', ')}` : null,
      ].filter(Boolean);
      if (!rows.length) return '';
      return `<div class="gt">
        <div class="gt-title">${L.nearStation} ${esc(ep.name)}</div>
        ${rows.map((r) => `<div class="gt-row">${esc(r)}</div>`).join('')}
      </div>`;
    }

    function warningsHtml(warnings) {
      if (!warnings || !warnings.length) return '';
      const items = warnings.map((w) => `<div class="warn-item ${esc(w.status)}">
        <b>${esc(w.station)}${w.title ? ` — ${esc(w.title)}` : ''}</b>
        ${w.description ? esc(w.description) : ''}
      </div>`).join('');
      return `<div class="sect">${L.warnings}</div><div class="warns">${items}</div>`;
    }

    function renderRoutes() {
      const d = data;
      L = DICT[d.lang] || DICT.en;
      document.documentElement.lang = d.lang === 'cn' ? 'zh' : d.lang;
      document.documentElement.dir = d.lang === 'ar' ? 'rtl' : 'ltr';

      const op = d.operating || {};
      // Clock marks only make sense while the metro is open: the search assumes boarding now
      const startClock = op.isOpen ? op.moscowTime : null;
      // The user's walks to the departure station and from the arrival station; 0 — unknown
      const walkSec = d.walkToMetroSec || 0;
      const walkFromSec = d.walkFromMetroSec || 0;

      let banner = '';
      if (op.isOpen === false) {
        banner = `<div class="banner danger">⛔ ${esc(L.closedNow(op))}</div>`;
      } else if (op.minutesToClose !== undefined && op.minutesToClose <= 30) {
        banner = `<div class="banner warn">⚠️ ${esc(L.closesSoon(op))}</div>`;
      }

      const v = d.variants[selected];

      document.getElementById('app').innerHTML = `<div class="panel">
        ${currentDataUrl ? `<button class="refresh" id="refreshBtn" type="button">↻ ${esc(L.refresh)}</button>` : ''}
        <div class="od">${ENDS.map(selectHtml).join('')}</div>
        <div id="odNotice" class="hidden"></div>
        ${banner}
        <div class="sect">${L.routes}</div>
        ${d.variants.length
          ? `<div class="variants">${d.variants.map((x, i) => variantCard(x, i, startClock, walkSec, walkFromSec)).join('')}</div>
             <div class="sect">${L.details}</div>
             ${timelineHtml(v, startClock, walkSec, walkFromSec)}
             ${breakdownHtml(v, walkSec, walkFromSec)}
             ${groundTransportHtml(v)}`
          : `<div class="banner warn">${esc(L.noRoutes)}</div>`}
        ${warningsHtml(d.warnings)}
        ${d.closuresApplied ? `<div class="breakdown">ℹ️ ${esc(L.closures)}</div>` : ''}
      </div>`;

      for (const el of document.querySelectorAll('.vcard')) {
        el.addEventListener('click', () => {
          selected = +el.dataset.idx;
          renderRoutes();
        });
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selected = +el.dataset.idx;
            renderRoutes();
          }
        });
      }

      const refreshBtn = document.getElementById('refreshBtn');
      if (refreshBtn) {
        refreshBtn.addEventListener('click', refreshRoute);
      }

      // The panel markup was rebuilt from scratch — re-attach the selects and restore the notice
      mountSelects();
      showNotice(notice, noticeKind);
    }

    // ─── Station selects: markup and interaction ─────────────────────────────

    /** Search parameters of a URL; an empty set when the string is not a URL at all */
    function urlParamsOf(url) {
      try {
        return new URL(url).searchParams;
      } catch {
        return new URLSearchParams();
      }
    }

    /** A parameter of the card's signed link (language, city, walk times) */
    const routeParam = (name) => urlParamsOf(currentDataUrl).get(name);

    /** «12,163» → [12, 163]; anything non-numeric is dropped */
    const idsFromParam = (raw) => String(raw || '')
      .split(',')
      .map((s) => Number(s.trim()))
      .filter((n) => Number.isInteger(n) && n >= 0);

    /** One combo field: a text input over the station list plus the badges of the chosen station */
    function selectHtml(end) {
      const cur = sel[end] || { name: '', lines: [] };
      const label = end === 'from' ? L.fromLabel : L.toLabel;
      return `<div class="od-sel" id="odsel-${end}">
        <div class="od-field">
          <span class="od-badges" id="odb-${end}">${(cur.lines || []).map(badgeHtml).join('')}</span>
          <input id="odi-${end}" type="text" autocomplete="off" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-controls="odl-${end}" aria-autocomplete="list"
                 aria-label="${esc(label)}" placeholder="${esc(L.stationPlaceholder)}" value="${esc(cur.name)}">
          <span class="od-caret" aria-hidden="true">⌄</span>
        </div>
        <div class="od-list hidden" id="odl-${end}" role="listbox" aria-label="${esc(label)}"></div>
      </div>`;
    }

    /** Wires both combo fields after the panel markup has been (re)built */
    function mountSelects() {
      // The previous markup is gone, so no dropdown can still be open over it
      openEnd = null;
      optItems = [];
      optIndex = -1;
      for (const end of ENDS) {
        const input = document.getElementById(`odi-${end}`);
        if (!input) {
          continue;
        }
        input.addEventListener('focus', () => openDropdown(end));
        input.addEventListener('click', () => openDropdown(end));
        input.addEventListener('input', () => {
          optQuery = input.value;
          optIndex = -1;
          renderOptions(end);
        });
        input.addEventListener('keydown', (e) => onSelectKeydown(end, e));
      }
    }

    /**
     * Opens one dropdown. The typed filter starts empty (the whole city, alphabetical) while the
     * input keeps showing the current station with its text selected — typing replaces it.
     */
    function openDropdown(end) {
      if (openEnd === end) {
        return;
      }
      closeDropdown();
      const input = document.getElementById(`odi-${end}`);
      const list = document.getElementById(`odl-${end}`);
      if (!input || !list) {
        return;
      }
      openEnd = end;
      optQuery = '';
      optIndex = -1;
      input.setAttribute('aria-expanded', 'true');
      list.classList.remove('hidden');
      input.select();
      renderOptions(end);
      ensureStations().then(() => {
        if (openEnd === end) {
          renderOptions(end);
        }
      });
    }

    /** Closes the open dropdown and puts the current station's name back into the input */
    function closeDropdown() {
      if (!openEnd) {
        return;
      }
      const end = openEnd;
      openEnd = null;
      optItems = [];
      const input = document.getElementById(`odi-${end}`);
      const list = document.getElementById(`odl-${end}`);
      if (input) {
        input.setAttribute('aria-expanded', 'false');
        input.removeAttribute('aria-activedescendant');
        input.value = (sel[end] && sel[end].name) || '';
      }
      if (list) {
        list.classList.add('hidden');
        list.innerHTML = '';
      }
      reportSize();
    }

    /** Stations matching the typed filter — plain case-insensitive substring, empty filter matches all */
    function filteredStations() {
      if (!stationList) {
        return [];
      }
      const q = optQuery.trim().toLocaleLowerCase();
      if (!q) {
        return stationList;
      }
      return stationList.filter((s) => s.name.toLocaleLowerCase().includes(q));
    }

    /** Fills the open dropdown: the loading note, the load error, «nothing found» or the options */
    function renderOptions(end) {
      const list = document.getElementById(`odl-${end}`);
      if (!list) {
        return;
      }
      if (!stationList) {
        optItems = [];
        list.innerHTML = `<div class="od-note">${esc(stationsFailed ? L.stationsLoadError : L.stationsLoading)}</div>`;
        reportSize();
        return;
      }
      optItems = filteredStations();
      if (!optItems.length) {
        list.innerHTML = `<div class="od-note">${esc(L.noMatches)}</div>`;
        reportSize();
        return;
      }
      list.innerHTML = optItems.map((s, i) => `<div class="od-opt${i === optIndex ? ' active' : ''}" role="option"
          id="odo-${end}-${i}" data-i="${i}" aria-selected="${i === optIndex ? 'true' : 'false'}">
          <span class="od-nm">${esc(s.name)}</span>${(s.lines || []).map(badgeHtml).join('')}
        </div>`).join('');
      for (const el of list.querySelectorAll('.od-opt')) {
        // mousedown, not click: the input's blur must not tear the list down before the pick lands
        el.addEventListener('mousedown', (e) => {
          e.preventDefault();
          chooseStation(end, optItems[+el.dataset.i]);
        });
      }
      updateActiveDescendant(end);
      reportSize();
    }

    /** Points the input's aria-activedescendant at the highlighted option (or clears it) */
    function updateActiveDescendant(end) {
      const input = document.getElementById(`odi-${end}`);
      if (!input) {
        return;
      }
      if (optIndex >= 0) {
        input.setAttribute('aria-activedescendant', `odo-${end}-${optIndex}`);
      } else {
        input.removeAttribute('aria-activedescendant');
      }
    }

    /** Moves the highlight to another option, keeping it inside the scrolled viewport */
    function setActiveOption(end, idx) {
      optIndex = idx;
      const list = document.getElementById(`odl-${end}`);
      if (!list) {
        return;
      }
      for (const el of list.querySelectorAll('.od-opt')) {
        const on = +el.dataset.i === idx;
        el.classList.toggle('active', on);
        el.setAttribute('aria-selected', on ? 'true' : 'false');
        if (on) {
          el.scrollIntoView({ block: 'nearest' });
        }
      }
      updateActiveDescendant(end);
    }

    /** Keyboard: arrows move the highlight, Enter picks, Esc and Tab close */
    function onSelectKeydown(end, e) {
      if (e.key === 'Escape' || e.key === 'Tab') {
        closeDropdown();
        return;
      }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (openEnd !== end) {
          openDropdown(end);
          return;
        }
        if (!optItems.length) {
          return;
        }
        let next = optIndex + (e.key === 'ArrowDown' ? 1 : -1);
        if (next < 0) {
          next = optItems.length - 1;
        }
        if (next >= optItems.length) {
          next = 0;
        }
        setActiveOption(end, next);
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (openEnd === end && optIndex >= 0) {
          chooseStation(end, optItems[optIndex]);
        }
      }
    }

    /** True when both ends share a platform — one and the same hub, so there is no route to build */
    function sameStations() {
      const a = (sel.from && sel.from.ids) || [];
      const b = new Set((sel.to && sel.to.ids) || []);
      return a.some((id) => b.has(id));
    }

    /** Applies a pick: updates the field, forgets the stale walk time and schedules the recompute */
    function chooseStation(end, station) {
      if (!station) {
        return;
      }
      const previous = sel[end];
      sel[end] = { name: station.name, ids: station.ids.slice(), lines: station.lines || [] };
      closeDropdown();
      const input = document.getElementById(`odi-${end}`);
      if (input) {
        input.value = station.name;
      }
      const badges = document.getElementById(`odb-${end}`);
      if (badges) {
        badges.innerHTML = (station.lines || []).map(badgeHtml).join('');
      }
      if (previous && previous.ids.join(',') === sel[end].ids.join(',')) {
        return; // the very same station picked again — nothing to recompute
      }
      // The user's walk time to (or from) the replaced end describes a station that is no longer there
      if (end === 'from') {
        walkParams.walk = null;
      } else {
        walkParams.walkFrom = null;
      }
      stationsChanged = true;
      if (sameStations()) {
        showNotice(L.sameStations, 'warn');
        return;
      }
      scheduleRecompute();
    }

    /** Shows (or clears with a null text) the message strip above the live card */
    function showNotice(text, kind) {
      notice = text || null;
      noticeKind = kind || 'info';
      const el = document.getElementById('odNotice');
      if (!el) {
        return;
      }
      el.className = notice ? `banner ${noticeKind}` : 'hidden';
      el.textContent = notice || '';
      reportSize();
    }

    // ─── Station list over REST ──────────────────────────────────────────────

    /** One GET /api/widget-stations attempt: `{ status, stations? }`, status 0 for a transport failure */
    async function requestStations() {
      let url;
      try {
        url = new URL('/api/widget-stations', currentDataUrl);
      } catch {
        return { status: 0 };
      }
      url.searchParams.set('lang', routeParam('lang') || 'en');
      const city = routeParam('city');
      if (city) {
        url.searchParams.set('city', city);
      }
      url.searchParams.set('token', recomputeToken || '');
      let resp;
      try {
        resp = await fetch(url.toString(), { headers: { accept: 'application/json' } });
      } catch {
        return { status: 0 };
      }
      if (!resp.ok) {
        return { status: resp.status };
      }
      try {
        const json = await resp.json();
        return Array.isArray(json && json.stations) ? { status: 200, stations: json.stations } : { status: 0 };
      } catch {
        return { status: 0 };
      }
    }

    /**
     * Fetches the station list once and caches it. Concurrent callers share the same in-flight
     * promise. A 403 means the card's token expired while it sat open — renew it once and retry.
     */
    function ensureStations() {
      // A host may hand the same card a result for another language or city — the list is per pair
      const key = `${routeParam('lang') || 'en'}|${routeParam('city') || 'moscow'}`;
      if (key !== stationsKey) {
        stationsKey = key;
        stationList = null;
        stationsPending = null;
      }
      if (stationList) {
        return Promise.resolve();
      }
      if (stationsPending) {
        return stationsPending;
      }
      stationsFailed = false;
      stationsPending = (async () => {
        let res = await requestStations();
        if (res.status === 403 && (await renewToken())) {
          res = await requestStations();
        }
        if (res.stations) {
          stationList = res.stations;
        } else {
          stationsFailed = true;
        }
        stationsPending = null;
      })();
      return stationsPending;
    }

    // ─── Route recompute over REST ───────────────────────────────────────────

    /** Recompute URL for the current pick; null while the card has no token or no selection yet */
    function recomputeUrl() {
      if (!currentDataUrl || !recomputeToken || !sel.from || !sel.to) {
        return null;
      }
      let url;
      try {
        url = new URL('/api/widget-data', currentDataUrl);
      } catch {
        return null;
      }
      url.searchParams.set('from', sel.from.ids.join(','));
      url.searchParams.set('to', sel.to.ids.join(','));
      url.searchParams.set('lang', routeParam('lang') || 'en');
      const city = routeParam('city');
      if (city) {
        url.searchParams.set('city', city);
      }
      // Only the walk time of the end the user did NOT replace still describes something real
      if (walkParams.walk) {
        url.searchParams.set('walk', walkParams.walk);
      }
      if (walkParams.walkFrom) {
        url.searchParams.set('walkFrom', walkParams.walkFrom);
      }
      url.searchParams.set('token', recomputeToken);
      return url.toString();
    }

    /** One GET of a widget-data URL: `{ status, data? }`, status 0 for a transport failure */
    async function requestRouteData(url) {
      let resp;
      try {
        resp = await fetch(url, { headers: { accept: 'application/json' } });
      } catch {
        return { status: 0 };
      }
      if (!resp.ok) {
        return { status: resp.status };
      }
      try {
        return { status: 200, data: await resp.json() };
      } catch {
        return { status: 0 };
      }
    }

    /**
     * One silent token renewal: re-request the card's signed link (without `at`) purely to pick up a
     * fresh token. The route payload of that response is intentionally ignored — the user's current
     * station choice must survive the renewal. Allowed once per expiry; a second 403 is a real error.
     */
    async function renewToken() {
      if (tokenRenewed || !currentDataUrl) {
        return false;
      }
      tokenRenewed = true;
      let url;
      try {
        url = new URL(currentDataUrl);
      } catch {
        return false;
      }
      url.searchParams.delete('at');
      const res = await requestRouteData(url.toString());
      if (res.data && typeof res.data.token === 'string') {
        recomputeToken = res.data.token;
        return true;
      }
      return false;
    }

    /**
     * Trailing throttle: a request goes out immediately when the previous one is at least
     * RECOMPUTE_MS old, otherwise it is deferred to the boundary of the interval and carries the
     * LAST pick — intermediate choices made in a quick burst collapse into one request.
     */
    function scheduleRecompute() {
      showNotice(L.recalculating, 'info');
      const wait = Math.max(0, RECOMPUTE_MS - (Date.now() - lastRecomputeAt));
      if (recomputeTimer) {
        clearTimeout(recomputeTimer);
        recomputeTimer = null;
      }
      if (!wait) {
        runRecompute();
        return;
      }
      recomputeTimer = setTimeout(() => {
        recomputeTimer = null;
        runRecompute();
      }, wait);
    }

    /**
     * Sends the recompute and swaps the card's data in place. A failure never wipes the card: the
     * current route stays on screen with a warning strip above it and the selects still working.
     */
    async function runRecompute() {
      if (sameStations()) {
        showNotice(L.sameStations, 'warn');
        return;
      }
      const url = recomputeUrl();
      if (!url) {
        showNotice(L.recalcError, 'danger');
        return;
      }
      lastRecomputeAt = Date.now();
      let res = await requestRouteData(url);
      if (res.status === 403 && (await renewToken())) {
        const retryUrl = recomputeUrl();
        res = retryUrl ? await requestRouteData(retryUrl) : res;
      }
      if (!res.data) {
        showNotice(L.recalcError, 'danger');
        return;
      }
      data = res.data;
      adoptToken(data);
      selected = 0;
      notice = null;
      renderRoutes();
      pushModelContext();
    }

    /** Remembers the fresh recompute token carried by every successful data response */
    function adoptToken(json) {
      if (json && typeof json.token === 'string') {
        recomputeToken = json.token;
        tokenRenewed = false;
      }
    }

    // ─── Route data loading over REST ────────────────────────────────────────
    /** Loading placeholder (localized) while the route data is fetched */
    function showLoading() {
      document.getElementById('app').innerHTML =
        `<div class="panel"><div class="loading">${esc(L.loadingRoutes)}</div></div>`;
    }

    /** Error panel with a localized message */
    function showDataError(message) {
      document.getElementById('app').innerHTML =
        `<div class="md error"><p>${esc(message)}</p></div>`;
    }

    /**
     * Fetches the route data from a self-describing link and renders it. A 400/404 (stale link,
     * changed data) shows the "ask again" message; a network/CSP failure shows the "server
     * unreachable" message. This is a plain fetch — never a tools/call — so it works identically in
     * every channel, including a Telegram Mini App.
     */
    async function loadRouteData(url) {
      currentDataUrl = url;
      applyLang(langFromUrl(url));
      showLoading();
      let resp;
      try {
        resp = await fetch(url, { headers: { accept: 'application/json' } });
      } catch {
        showDataError(L.netError);
        return;
      }
      if (!resp.ok) {
        showDataError(L.loadError);
        return;
      }
      let json;
      try {
        json = await resp.json();
      } catch {
        showDataError(L.loadError);
        return;
      }
      data = json;
      adoptToken(json);
      selected = 0;
      notice = null;
      // A signed link describes one fixed pair of stations: the card starts over from it
      stationsChanged = false;
      const q = urlParamsOf(url);
      walkParams = { walk: q.get('walk'), walkFrom: q.get('walkFrom') };
      syncSelectionFromLink(q);
      renderRoutes();
      pushModelContext();
    }

    /**
     * Initial state of the two selects: the names come from the loaded route data, the platform ids
     * from the link the data was loaded by, and the badges from the first variant's endpoints (until
     * the station list arrives and a pick brings the hub's full set of badges).
     */
    function syncSelectionFromLink(params) {
      const first = data && data.variants && data.variants[0];
      const depLine = first && first.departure ? first.departure.line : null;
      const arrLine = first && first.arrival ? first.arrival.line : null;
      sel.from = { name: (data && data.from) || '', ids: idsFromParam(params.get('from')), lines: depLine ? [depLine] : [] };
      sel.to = { name: (data && data.to) || '', ids: idsFromParam(params.get('to')), lines: arrLine ? [arrLine] : [] };
    }

    /**
     * Leave a trace of what the user is seeing in the model context (ui/update-model-context) so the
     * agent can answer follow-up questions. This is invisible in the chat — nothing is shown, the
     * host just keeps the summary for future turns. Sent only when the host advertises the capability;
     * degrades silently otherwise. Each call overwrites the previous summary (e.g. after Refresh).
     */
    function pushModelContext() {
      if (!hostCapabilities || !hostCapabilities.updateModelContext) return;
      const text = data && data.modelSummary;
      if (!text) return;
      rpcRequest('ui/update-model-context', { content: [{ type: 'text', text: text }] }).catch(() => {});
    }

    /**
     * "Refresh route": until the user touches the selects this reloads the card's own link without
     * `at`, so the original route is rebuilt for "now". Once the stations have been changed, the
     * same button re-runs the token recompute for the pair currently shown in the selects.
     */
    function refreshRoute() {
      if (stationsChanged) {
        scheduleRecompute();
        return;
      }
      if (!currentDataUrl) {
        return;
      }
      let url;
      try {
        const u = new URL(currentDataUrl);
        u.searchParams.delete('at'); // the signature does not cover `at`, so it stays valid
        url = u.toString();
      } catch {
        url = currentDataUrl;
      }
      loadRouteData(url);
    }

    // ─── Markdown-lite fallback (station info, clarifications, errors) ───────
    // The tool's other responses are English/localized markdown; render the basics:
    // headings, bold/italics, lists, tables, paragraphs.
    function inlineMd(s) {
      return esc(s)
        .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
        .replace(/_([^_]+)_/g, '<em>$1</em>')
        .replace(/«([^»]+)»/g, '«<b>$1</b>»');
    }
    function renderMarkdown(text, isError) {
      const out = [];
      const lines = String(text).split(/\r?\n/);
      let list = null; // 'ul' | 'ol'
      let table = null; // array of rows
      const flushList = () => { if (list) { out.push(`</${list}>`); list = null; } };
      const flushTable = () => {
        if (!table) return;
        const [head, ...body] = table;
        out.push('<table><thead><tr>');
        out.push(head.map((c) => `<th>${inlineMd(c)}</th>`).join(''));
        out.push('</tr></thead><tbody>');
        for (const row of body) {
          out.push(`<tr>${row.map((c) => `<td>${inlineMd(c)}</td>`).join('')}</tr>`);
        }
        out.push('</tbody></table>');
        table = null;
      };
      for (const raw of lines) {
        const line = raw.trimEnd();
        const cells = /^\|(.+)\|$/.exec(line.trim());
        if (cells) {
          flushList();
          const row = cells[1].split('|').map((c) => c.trim());
          if (row.every((c) => /^:?-{3,}:?$/.test(c))) continue; // separator row
          (table = table || []).push(row);
          continue;
        }
        flushTable();
        const h = /^(#{1,3})\s+(.*)$/.exec(line);
        if (h) { flushList(); out.push(`<h${h[1].length}>${inlineMd(h[2])}</h${h[1].length}>`); continue; }
        const li = /^[-*]\s+(.*)$/.exec(line);
        if (li) {
          if (list !== 'ul') { flushList(); out.push('<ul>'); list = 'ul'; }
          out.push(`<li>${inlineMd(li[1])}</li>`);
          continue;
        }
        const oli = /^\d+\.\s+(.*)$/.exec(line);
        if (oli) {
          if (list !== 'ol') { flushList(); out.push('<ol>'); list = 'ol'; }
          out.push(`<li>${inlineMd(oli[1])}</li>`);
          continue;
        }
        flushList();
        if (line.trim()) out.push(`<p>${inlineMd(line)}</p>`);
      }
      flushList();
      flushTable();
      document.getElementById('app').innerHTML = `<div class="md${isError ? ' error' : ''}">${out.join('')}</div>`;
    }

    // ─── Tool result dispatch ────────────────────────────────────────────────
    function onToolResult(result) {
      document.getElementById('loading').classList.add('hidden');
      if (!result || typeof result !== 'object') return;
      const sc = result.structuredContent;
      // Route response: structuredContent carries only a self-describing link — fetch the data.
      if (sc && sc.widget === 'metro-routes' && sc.dataUrl) {
        loadRouteData(sc.dataUrl);
        return;
      }
      const textBlock = Array.isArray(result.content)
        ? result.content.find((b) => b && b.type === 'text' && typeof b.text === 'string')
        : null;
      if (textBlock) {
        renderMarkdown(textBlock.text, !!result.isError);
      }
    }

    // ─── Host context (theme / style variables / fonts) ──────────────────────
    function applyHostContext(ctx) {
      if (!ctx) return;
      if (ctx.theme) {
        document.documentElement.dataset.theme = ctx.theme;
        document.documentElement.style.colorScheme = ctx.theme;
      }
      const vars = ctx.styles && ctx.styles.variables;
      if (vars) {
        for (const [k, val] of Object.entries(vars)) {
          if (k.startsWith('--') && typeof val === 'string') {
            document.documentElement.style.setProperty(k, val);
          }
        }
      }
    }

    // ─── Message loop ────────────────────────────────────────────────────────
    window.addEventListener('message', (ev) => {
      const m = ev.data;
      if (!m || typeof m !== 'object' || m.jsonrpc !== '2.0') return;

      if (m.id != null && !m.method && pending.has(m.id)) {
        const { resolve, reject } = pending.get(m.id);
        pending.delete(m.id);
        m.error ? reject(m.error) : resolve(m.result);
        return;
      }
      if (m.method === 'ui/notifications/tool-result') {
        // Spec: params IS the CallToolResult; some hosts wrap it as { result }
        onToolResult(m.params && m.params.result ? m.params.result : m.params);
        return;
      }
      if (m.method === 'ui/notifications/tool-input' || m.method === 'ui/notifications/tool-input-partial') {
        if (!data) document.getElementById('loading').classList.remove('hidden');
        return;
      }
      if (m.method === 'ui/notifications/tool-cancelled') {
        document.getElementById('loading').classList.add('hidden');
        return;
      }
      if (m.method === 'ui/notifications/host-context-changed') {
        applyHostContext(m.params || {});
        return;
      }
      if (m.method === 'ui/resource-teardown' && m.id != null) {
        rpcRespond(m.id, {});
        return;
      }
      if (m.method === 'ping' && m.id != null) {
        rpcRespond(m.id, {});
      }
    });

    // A click anywhere outside the open dropdown closes it (mousedown so it beats the input's blur)
    document.addEventListener('mousedown', (ev) => {
      if (!openEnd) {
        return;
      }
      const wrap = document.getElementById(`odsel-${openEnd}`);
      if (!wrap || !wrap.contains(ev.target)) {
        closeDropdown();
      }
    });

    // ─── Auto-resize ─────────────────────────────────────────────────────────
    let lastH = 0;
    const reportSize = () => {
      const h = document.documentElement.scrollHeight;
      if (h !== lastH) {
        lastH = h;
        rpcNotify('ui/notifications/size-changed', { width: document.documentElement.scrollWidth, height: h });
      }
    };
    new ResizeObserver(reportSize).observe(document.body);

    // ─── Handshake ───────────────────────────────────────────────────────────
    rpcRequest('ui/initialize', {
      protocolVersion: '2026-01-26',
      appInfo: { name: 'mos-metro-routes', version: '1.0.0' },
      appCapabilities: { availableDisplayModes: ['inline'] },
    }).then((res) => {
      applyHostContext(res && res.hostContext);
      hostCapabilities = (res && res.hostCapabilities) || {};
      rpcNotify('ui/notifications/initialized', {});
    }).catch(() => {
      // Keep listening anyway: a non-conforming host may skip the handshake response
      rpcNotify('ui/notifications/initialized', {});
    });
  </script>
</body>
</html>
